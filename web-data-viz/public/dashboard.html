<script>

  var nome = sessionStorage.NOME_USUARIO;
  var id = sessionStorage.ID_USUARIO;
  var fkempresa = sessionStorage.FK_EMPRESA;

  var ListaValores = [];
  var ListaClientes = [];
  var infosConsultorAtual = [];
  var Top2Consultores = [];
  var DadosGrafico = [];
  var ListaKPIs = [];

  var chartRendaMensal = null;

  function carregarFuncoes(){

    Userlogado();
    validarSessao();
    infosUserLogado();
    getTop2Consultores();
    BuscarGrafico();
    getKPIs();

    setInterval(() => {
    
      Userlogado();
      validarSessao();

    }, 6000);

  }

  function ChamaLimparSessao(){

    limparSessao(id);

  }
  
  async function infosUserLogado(){

    const resposta = await fetch(`/usuarios/buscarPerfil/${id}`);   
    const dados = await resposta.json();
    infosConsultorAtual = dados;

    if(infosConsultorAtual[0].superior != null){
  
      consultores_session.innerHTML = ``;
  
    }
  }

  function Userlogado(){

        if((nome != null || nome != undefined) && (id != null || id != undefined)){

            name_user.innerHTML = `${nome}`

        }

  }

  async function getTop2Consultores() {
    
    const resposta2 = await fetch(`/dashboard/getConsultores/${fkempresa}`);   
    const dados2 = await resposta2.json();
    Top2Consultores = dados2;

    consultorTop1.innerHTML = `${Top2Consultores[0].NomeConsultor}`;
    consultorTop2.innerHTML = `${Top2Consultores[1].NomeConsultor}`;

  }

  async function getKPIs() {
    
    const resposta4 = await fetch(`/dashboard/getKPIs/${fkempresa}`);   
    const dados4 = await resposta4.json();
    ListaKPIs = dados4;

    kpi1.innerHTML = `${ListaKPIs.MaiorTier[0].cluster}`;
    kpi2.innerHTML = `${ListaKPIs.MaiorRegiao[0].macro_regiao}`;
    kpi3.innerHTML = `${ListaKPIs.TopDestino[0].cidade}`;
    kpi4.innerHTML = `R$ ${ListaKPIs.FaturamentoTotal[0].total_faturado_geral}`;

  }

  async function BuscarGrafico() {
    
    const resposta3 = await fetch(`/dashboard/buscarDadosGrafico/${fkempresa}`);   
    const dados3 = await resposta3.json();
    DadosGrafico = dados3;

    renderizarGrafico(DadosGrafico);

  }

  function renderizarGrafico(dados) {
    const canvasId = 'rendaMensalChart';
    const canvas = document.getElementById(canvasId);

    const chartExistente = Chart.getChart(canvasId); 
    
    if (chartExistente) {
        chartExistente.destroy();
    }
    // ---------------------------

    const ctx = canvas.getContext('2d');

    // Separa os dados em arrays para o Chart.js
    const labels = dados.map(item => item.mes_label); 
    const faturamento = dados.map(item => item.faturamento_total); 
    const crescimento = dados.map(item => item.crescimento_percentual); 

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Renda total (R$)',
                    data: faturamento,
                    backgroundColor: '#1E88E5', 
                    borderRadius: 5,
                    order: 2,
                    yAxisID: 'y' 
                },
                {
                    label: 'Crescimento (%)',
                    data: crescimento,
                    backgroundColor: '#90CAF9',
                    borderRadius: 5,
                    order: 1,
                    yAxisID: 'y1'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: '📈 Renda mensal',
                    font: { size: 16, weight: 'bold' },
                    padding: { bottom: 20 }
                },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            let value = context.parsed.y;
                            
                            // Verifica se é null ou undefined antes de formatar
                            if (value === null || value === undefined) return label;

                            if (label.includes('Renda')) {
                                return label + ': ' + new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
                            } else {
                                return label + ': ' + value + '%';
                            }
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false }
                },
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: { display: true, text: 'Renda (R$)' },
                    ticks: {
                        callback: function(value) {
                            return 'R$ ' + (value / 1000) + 'k'; 
                        }
                    }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    title: { display: true, text: 'Crescimento (%)' },
                    grid: { drawOnChartArea: false }, 
                    ticks: {
                        callback: function(value) {
                            return value + '%';
                        }
                    }
                }
            }
        }
    });
}

  //mascara para inputs
  let fecharTimeoutBloq = null;

  function bloquearConsultor(botao) {
    let cardBloqueado = document.getElementById("cardBloq");
    let titulo = cardBloqueado.querySelector("h1");

    // Pega o nome do consultor
    let nome = botao
      .closest(".cardConsultor")
      .querySelector(".infos_consultor h2").textContent;

    // Alterna bloqueado/desbloqueado
    botao.classList.toggle("fechado");

    // Define a frase conforme o estado
    if (botao.classList.contains("fechado")) {
      titulo.textContent = `Consultor ${nome} Bloqueado`;
    } else {
      titulo.textContent = `Consultor ${nome} Desbloqueado`;
    }

    // Exibe o card
    cardBloqueado.style.display = "flex";
    const barra = cardBloqueado.querySelector(".temporizadorBloq");
    barra.style.animation = "none";
    void barra.offsetWidth;
    barra.style.animation = "temporizadora 3s linear forwards";

    // Timeout para fechar
    if (fecharTimeoutBloq) clearTimeout(fecharTimeoutBloq);

    fecharTimeoutBloq = setTimeout(() => {
      cardBloqueado.style.display = "none";
      fecharTimeoutBloq = null;
    }, 3000);
  }

</script>
