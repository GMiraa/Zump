<script>

  var nome = sessionStorage.NOME_USUARIO;
  var id = sessionStorage.ID_USUARIO;
  var fkempresa = sessionStorage.FK_EMPRESA;

  var ListaClientes = [];
  var infosConsultorAtual = [];

  
  function carregarFuncoes(){
    
    Userlogado();
    validarSessao();
    infosUserLogado();
    
  }
  async function infosUserLogado(){

    const resposta = await fetch(`/usuarios/buscarPerfil/${id}`);   
    const dados = await resposta.json();
    infosConsultorAtual = dados;

    if(infosConsultorAtual[0].superior != null){
  
      consultores_session.innerHTML = ``;
  
    }
  }

  
  function Userlogado(){

        if((nome != null || nome != undefined) && (id != null || id != undefined)){

            name_user.innerHTML = `${nome}`

        }

  }


  //mascara para inputs
  let fecharTimeoutBloq = null;

  function bloquearConsultor(botao) {
    let cardBloqueado = document.getElementById("cardBloq");
    let titulo = cardBloqueado.querySelector("h1");

    // Pega o nome do consultor
    let nome = botao
      .closest(".cardConsultor")
      .querySelector(".infos_consultor h2").textContent;

    // Alterna bloqueado/desbloqueado
    botao.classList.toggle("fechado");

    // Define a frase conforme o estado
    if (botao.classList.contains("fechado")) {
      titulo.textContent = `Consultor ${nome} Bloqueado`;
    } else {
      titulo.textContent = `Consultor ${nome} Desbloqueado`;
    }

    // Exibe o card
    cardBloqueado.style.display = "flex";
    const barra = cardBloqueado.querySelector(".temporizadorBloq");
    barra.style.animation = "none";
    void barra.offsetWidth;
    barra.style.animation = "temporizadora 3s linear forwards";

    // Timeout para fechar
    if (fecharTimeoutBloq) clearTimeout(fecharTimeoutBloq);

    fecharTimeoutBloq = setTimeout(() => {
      cardBloqueado.style.display = "none";
      fecharTimeoutBloq = null;
    }, 3000);
  }

</script>
