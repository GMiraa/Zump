async function graficoPacote() {
  const canvasId = 'visitasChart';
  const canvas = document.getElementById(canvasId);
  if (!canvas) {
    console.warn('Canvas não encontrado:', canvasId);
    return;
  }

  let dados = null;

  // Tenta buscar dados do backend
  try {
    const resp = await fetch('/dashboard/visitasPacotes');
    if (resp.ok) {
      dados = await resp.json();
    } else {
      console.warn('Falha ao buscar dados. Usando dados mock.');
    }
  } catch (err) {
    console.warn('Erro ao buscar dados. Usando dados mock:', err);
  }

  // Caso o backend não traga dados válidos
  if (!dados || !Array.isArray(dados.labels) || !Array.isArray(dados.visitas)) {
    dados = {
      labels: ['Pacote A', 'Pacote B', 'Pacote C', 'Pacote D', 'Pacote E'],
      visitas: [120, 95, 78, 45, 30]
    };
  }

  // Destroi gráfico anterior
  const chartExistente = Chart.getChart(canvasId);
  if (chartExistente) chartExistente.destroy();

  const ctx = canvas.getContext('2d');

  // Gradiente
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height || 300);
  gradient.addColorStop(0, 'rgba(27,102,124,1)');
  gradient.addColorStop(1, 'rgba(27,102,124,1)');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: dados.labels,
      datasets: [{
        label: 'Visitas',
        data: dados.visitas,
        backgroundColor: gradient,
        borderColor: 'rgba(10,100,160,0.9)',
        borderWidth: 1,
        borderRadius: 6,
        barThickness: 'flex'
      }]
    },
    options: {
      maintainAspectRatio: false,
      responsive: true,
      plugins: {
        legend: { display: false },
        title: {
          display: true,
          text: '✈️ Pacotes mais comprados nos últimos 5 meses',
          font: { size: 16, weight: 'bold' },
          padding: { top: 10, bottom: 20 }
        }
      },
      scales: {
        x: { grid: { display: false }},
        y: { beginAtZero: true }
      }
    }
  });
}

graficoPacote();


async function graficoTop3Cidades() {
  const canvasId = 'pizzaTopCidades';
  const canvas = document.getElementById(canvasId);

  if (!canvas) {
    console.warn('Canvas não encontrado:', canvasId);
    return;
  }

  let dados = [];

  // Buscar dados reais
  try {
    const resp = await fetch('/dashboard/dadosTurismo'); // AJUSTE A ROTA
    if (resp.ok) {
      dados = await resp.json();
    }
  } catch (e) {
    console.warn("Erro ao buscar dados, usando mock.", e);
  }

  // Caso o backend não traga dados, cria exemplo
  if (!dados.length) {
    dados = [
      { cidade: "Maceió", turistas: 1484500 },
      { cidade: "Salvador", turistas: 425281 },
      { cidade: "Fortaleza", turistas: 294020 },
      { cidade: "Rio Branco", turistas: 464108 },
      { cidade: "Vitória", turistas: 158600 },
      { cidade: "Belém", turistas: 572792 },
      { cidade: "Manaus", turistas: 147725 },
      { cidade: "Ilhéus", turistas: 49330 },
      { cidade: "Porto Seguro", turistas: 142480 },
      { cidade: "Juazeiro", turistas: 264858 }
    ];
  }

  // Ordenar por turistas (desc)
  dados.sort((a, b) => b.turistas - a.turistas);

  // PEGAR APENAS O TOP 3
  const top3 = dados.slice(0, 3);

  const labels = top3.map(item => item.cidade);
  const valores = top3.map(item => item.turistas);

  const chartExistente = Chart.getChart(canvasId);
  if (chartExistente) chartExistente.destroy();

  const ctx = canvas.getContext('2d');

  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: labels,
      datasets: [{
        label: 'Turistas',
        data: valores,
        backgroundColor: [
          '#1E88E5', '#43A047', '#FB8C00'
        ],
        borderColor: '#fff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title: {
          display: true,
          text: '🥇 TOP 3 Cidades com Mais Turistas',
          font: { size: 16, weight: 'bold' },
          padding: { top: 10, bottom: 20 }
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              return ctx.label + ': ' +
                ctx.raw.toLocaleString('pt-BR') + ' turistas';
            }
          }
        }
      }
    }
  });
}

  async function BuscarGrafico() {
    
    const resposta3 = await fetch(`/dashboard/buscarDadosGrafico/${fkempresa}`);   
    const dados3 = await resposta3.json();
    DadosGrafico = dados3;

    renderizarGrafico(DadosGrafico);

  function renderizarGrafico(dados) {
    const canvasId = 'rendaMensalChart';
    const canvas = document.getElementById(canvasId);

    const chartExistente = Chart.getChart(canvasId); 
    
    if (chartExistente) {
        chartExistente.destroy();
    }

    const ctx = canvas.getContext('2d');
    
    // Separa os dados em arrays
    const labels = dados.map(item => item.mes_label); 
    const faturamento = dados.map(item => item.faturamento_total); 

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Renda total (R$)',
                    data: faturamento,
                    backgroundColor: '#1E88E5',
                    borderRadius: 5,
                    yAxisID: 'y'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: '📈 Renda mensal últimos 5 meses',
                    font: { size: 16, weight: 'bold' },
                    padding: { bottom: 20 }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let value = context.parsed.y;
                            if (value === null || value === undefined) return '';
    
                            return 'Renda: ' + new Intl.NumberFormat('pt-BR', { 
                                style: 'currency', 
                                currency: 'BRL' 
                            }).format(value);
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false }
                },
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: { display: true, text: 'Renda (R$)' },
                    ticks: {
                        callback: function(value) {
                            return 'R$ ' + (value / 1000) + 'k'; 
                        }
                    }
                }
            }
        }
    });
}

  //mascara para inputs
  let fecharTimeoutBloq = null;

  function bloquearConsultor(botao) {
    let cardBloqueado = document.getElementById("cardBloq");
    let titulo = cardBloqueado.querySelector("h1");

    // Pega o nome do consultor
    let nome = botao
      .closest(".cardConsultor")
      .querySelector(".infos_consultor h2").textContent;

    // Alterna bloqueado/desbloqueado
    botao.classList.toggle("fechado");

    // Define a frase conforme o estado
    if (botao.classList.contains("fechado")) {
      titulo.textContent = `Consultor ${nome} Bloqueado`;
    } else {
      titulo.textContent = `Consultor ${nome} Desbloqueado`;
    }

    // Exibe o card
    cardBloqueado.style.display = "flex";
    const barra = cardBloqueado.querySelector(".temporizadorBloq");
    barra.style.animation = "none";
    void barra.offsetWidth;
    barra.style.animation = "temporizadora 3s linear forwards";

    // Timeout para fechar
    if (fecharTimeoutBloq) clearTimeout(fecharTimeoutBloq);

    fecharTimeoutBloq = setTimeout(() => {
      cardBloqueado.style.display = "none";
      fecharTimeoutBloq = null;
    }, 3000);
  }
