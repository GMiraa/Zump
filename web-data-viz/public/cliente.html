  async function adicionarPacote(botao, idPacote, idCliente, idUsuario) {

    var inputQtd = botao.parentElement.querySelector('input[type="number"]');
    var qtdPacote = inputQtd.value;

    // Validação simples
    if (!qtdPacote || qtdPacote <= 0) {
        alert("Por favor, informe uma quantidade válida.");
        return; 
    }

    const dataAtual = new Date();
    const ano = dataAtual.getFullYear();
    const mes = String(dataAtual.getMonth() + 1).padStart(2, '0'); // Adiciona 0 à esquerda se for mês < 10
    const dia = String(dataAtual.getDate()).padStart(2, '0');
    
    const dataFormatada = `${ano}-${mes}-${dia}`;

    fetch('/dashboard/cadastrarVenda', {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              idUser: idUsuario,
              Pacote: idPacote,
              idCli: idCliente,
              Quantidade: qtdPacote,
              DataVenda: dataFormatada
            })
          })
          alert("Venda cadastrada com sucesso")
          setTimeout(() => {
            location.reload();
          }, 1000);

    const card = botao.closest(".card2");
    const box = card.parentElement;
    const addP = botao;
    const pacote = card.querySelector(".pacoteAcao");

    const isSelected = addP.classList.contains("selected");

    // ----------------------
    //   ANIMAÇÃO (FLIP)
    // ----------------------
    const startPositions = [...box.children].map(el => {
        return { el, top: el.getBoundingClientRect().top };
    });

    // Se for selecionar → move para o topo
    if (!isSelected) {
        box.prepend(card);
    }

    // Pega as novas posições após mover
    const endPositions = startPositions.map(item => {
        return { el: item.el, top: item.el.getBoundingClientRect().top };
    });

    // Aplica animação em cada card
    endPositions.forEach((end, i) => {
        const el = end.el;
        const deltaY = startPositions[i].top - end.top;

        el.style.transform = `translateY(${deltaY}px)`;
        el.style.transition = "transform 0s";

        requestAnimationFrame(() => {
            el.style.transform = "";
            el.style.transition = "transform 0.35s ease";
        });
    });

    if (isSelected) {
        addP.style.backgroundImage = "url('./assets/icon/Add.svg')";
        pacote.style.backgroundImage = "url('./assets/icon/noPacote.svg')";
        addP.classList.remove("selected");
    } else {
        addP.style.backgroundImage = "url('./assets/icon/Checkmark.svg')";
        pacote.style.backgroundImage = "url('./assets/icon/yesPacote.svg')";
        addP.classList.add("selected");
    }

    addP.style.backgroundSize = "40px";
    addP.style.backgroundPosition = "center";
    addP.style.backgroundRepeat = "no-repeat";

    pacote.style.backgroundSize = "35px";
    pacote.style.backgroundPosition = "center";
    pacote.style.backgroundRepeat = "no-repeat";
}

async function buscarSugestoes() {

  var uf = document.getElementById("estadoPacote").value;
  var Praia = document.getElementById("Praia").checked;
  var Aeroporto = document.getElementById("Aeroporto").checked;
  var Rios = document.getElementById("Rios").checked;
  
  // Definição das Regiões para comparação
  const regioes = {
      sudeste: ['SP', 'RJ', 'MG', 'ES'],
      sul: ['PR', 'SC', 'RS'],
      nordeste: ['BA', 'SE', 'AL', 'PE', 'PB', 'RN', 'CE', 'PI', 'MA']
  };

  try {
      const resposta = await fetch(`/dashboard/BuscarSugestoes/${uf}/${Praia}/${Aeroporto}/${Rios}`);
      const dados = await resposta.json();
      ListaPacotesSugeridos = dados;

      Sugestoes.innerHTML = ``;

      for(var i = 0; i < ListaPacotesSugeridos.length; i++){
        
        let ufPacote = ListaPacotesSugeridos[i].uf;
        let min, max;

        if (regioes.sudeste.includes(ufPacote)) {
            min = 3000; 
            max = 5500;
        } else if (regioes.sul.includes(ufPacote)) {
            min = 2000; 
            max = 3500;
        } else if (regioes.nordeste.includes(ufPacote)) {
            min = 1500; 
            max = 2500;
        } else {
            min = 800; 
            max = 1400;
        }

        let valorGerado = Math.floor(Math.random() * (max - min + 1)) + min;

        let precoFormatado = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valorGerado);

        Sugestoes.innerHTML += `<div class="card2">
                    <div class="conteudoCardPacote">
                      <div class="estado_pacote">
                        <h2>Estado do pacote: ${ufPacote}</h2>
                        <div class="iconPacote pacoteAcao"></div>
                      </div>
                      <div class="info_pacote">
                        <p>Local do pacote: ${ListaPacotesSugeridos[i].cidade}</p>
                        <p>Preço: ${precoFormatado}</p>
                      </div>
                    </div>
                    <div class="btnConsultor">
                      <input type="number" min="1" value="1" style="width: 50px; margin-right: 10px; border-radius: 5px; border: 1px solid #ccc; padding-left: 5px;">
                      
                      <button
                          onclick="adicionarPacote(this, ${ListaPacotesSugeridos[i].idPacote}, ${idClienteSelecionado}, ${id})"
                          class="btnAdicionarPacote"
                      ></button>
                    </div>
                  </div>`;
      }

  } catch (erro) {
      console.error("Erro ao buscar sugestões:", erro);
  }
}
